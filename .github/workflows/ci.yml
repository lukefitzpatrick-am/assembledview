name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: npm ci + tsc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Ban strict billing line id equality (MB-4)
        run: npm run check:billing-line-id-equality

      - name: Client graph must not reach server-only / @/db
        run: npm run check:client-server-only

      - name: Drizzle snapshot matches schema (db:generate empty)
        run: npm run check:drizzle-snapshot

      - name: Schema mirror-ahead fixtures (no database)
        run: npm run test:db-drift

  production-build:
    name: npm run build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        env:
          AUTH0_DOMAIN: example.auth0.com
          AUTH0_CLIENT_ID: ci-build
          AUTH0_CLIENT_SECRET: ci-build
          AUTH0_SECRET: ci-auth0-secret-32-characters-min
          APP_BASE_URL: http://localhost:3000
          XANO_BASE_URL: https://ci.example.invalid
          XANO_PUBLISHERS_BASE_URL: https://ci.example.invalid
          XANO_CLIENTS_BASE_URL: https://ci.example.invalid
          XANO_MEDIA_DETAILS_BASE_URL: https://ci.example.invalid
          XANO_MEDIA_PLANS_BASE_URL: https://ci.example.invalid
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run build

  knip:
    name: knip (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Soft gate: surface unused-export noise without failing PRs yet.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Knip report
        id: knip
        run: |
          set +e
          npx knip --no-progress 2>&1 | tee knip-output.txt
          status=$?
          echo "knip_exit=$status" >> "$GITHUB_OUTPUT"

          unused_files=$(grep -cE '^\.' knip-output.txt 2>/dev/null || true)
          echo "## Knip summary (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exit code: \`$status\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(Unused|Unlisted|Unresolved|Duplicate|Configuration)' knip-output.txt | head -20 >> "$GITHUB_STEP_SUMMARY" || echo "(no category headers found)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Full log attached as artifact \`knip-output.txt\`." >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload knip log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knip-report
          path: knip-output.txt
          if-no-files-found: ignore
